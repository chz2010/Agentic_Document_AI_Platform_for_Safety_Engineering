services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://safety:safety@postgres:5432/safety_platform
      PROJECT_CHROMA_PATH: /app/vectordb/project_docs
      UPLOADS_DIR: /app/data/uploads
      MLFLOW_TRACKING_ENABLED: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: project2-agentic-document-ai
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: safetygraph
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./vectordb:/app/vectordb
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
      neo4j:
        condition: service_healthy

  mlflow:
    image: python:3.11-slim
    command: >
      sh -c "pip install mlflow==2.16.2 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/safetygraph
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p safetygraph 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safety
      POSTGRES_PASSWORD: safety
      POSTGRES_DB: safety_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety -d safety_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  mlflow_data:
  neo4j_data:
  neo4j_logs:
